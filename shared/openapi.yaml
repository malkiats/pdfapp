              schema:
                type: string
                format: binary
                examples: ["<binary result bytes>"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/extract-text:
    post:
      operationId: extractText
      tags: [pdf]
      summary: Extract text from a PDF
      description: |
        Returns the PDF text layer as UTF-8 plain text, pages separated by a form feed (U+000C). A PDF with no text layer returns an empty file (still `200`); there is no OCR.

        Synchronous: the result is the response body (`200`), delivered as
        `Content-Disposition: attachment; filename="extract-text-result.txt"`. The `options` part is an
        optional JSON object (part Content-Type `application/json`) whose shape is
        `ExtractTextOptions`; unknown keys are rejected with `validation_error`.
        Part filenames and part Content-Types are ignored: the server sniffs magic bytes.
        The whole request body is capped at `limits.max_request_bytes` from `GET /api/v1/tools`.
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractTextRequest"
            encoding:
              options:
                contentType: application/json
            examples:
              basic:
                summary: Typical request
                value:
                  file: "<binary PDF bytes>"
                  options: "{\"pages\":\"1-5\"}"
      responses:
        "200":
          description: The processed result, as an attachment.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Content-Disposition:
              description: Always `attachment` with a generated filename.
              required: true
              schema:
                type: string
                pattern: '^attachment; filename="[a-z0-9-]+-result\.[a-z0-9]+"$'
                examples: ['attachment; filename="extract-text-result.txt"']
            Content-Length:
              description: Result size in bytes.
              schema:
                type: integer
                minimum: 0
                examples: [1048576]
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
                format: binary
                examples: ["<binary result bytes>"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/compare-sites:
    post:
      operationId: compareSites
      tags: [web]
      summary: Compare two web pages
      description: |
        Fetches two public web pages and returns a diff of their visible text. JSON
        in, JSON out, no attachment. Synchronous.

        SSRF guard (security.md section 3): http and https only, ports 80 and 443,
        no credentials in the URL, length at most 2048, DNS resolved and vetted
        (private, loopback, link-local and metadata ranges refused), redirects
        followed manually (max 3, each hop re-checked), connect timeout 3 s and total
        10 s per page, response cap 5 MB, `text/html` and `text/plain` only, no
        JavaScript executed. A refused URL is `400 url_blocked` and the reason is never
        disclosed. A page that cannot be fetched (unreachable, timeout, too large,
        wrong content type) is `502 upstream_fetch_failed`. The submitted URLs are never
        logged or stored.
      x-phase: 3
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareSitesRequest"
            examples:
              basic:
                summary: Two versions of a page
                value:
                  url_a: https://example.org/pricing
                  url_b: https://example.org/pricing-new
                  options:
                    ignore_whitespace: true
                    granularity: line
      responses:
        "200":
          description: The diff.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareSitesResult"
              examples:
                changed:
                  summary: One line changed
                  value:
                    summary:
                      added: 1
                      removed: 1
                      unchanged: 2
                      similarity: 0.67
                    diff:
                      - op: equal
                        text: Pricing
                      - op: remove
                        text: Pro plan 5.99 USD per month
                      - op: add
                        text: Pro plan 6.99 USD per month
                      - op: equal
                        text: Cancel any time
                    truncated: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/uploads:
    post:
      operationId: createUpload
      tags: [uploads]
      summary: Start a large-file upload
      description: |
        Large-file flow, step 1 of 3. Additive to the inline multipart flow: use it when a
        file set exceeds `limits.inline_max_bytes` and `limits.large_files_enabled` is true.
        Declares the files; the server returns one presigned `PUT` target per file. The
        client never chooses object keys. Then: `PUT` each file to its `put_url` sending
        exactly the returned `headers` (step 2), and call `runUploadedTool` (step 3).
        Per-file size is capped by `limits.max_large_file_bytes`, the sum by
        `limits.max_large_total_bytes`; either overrun is `413 file_too_large`.
        `503 large_files_unavailable` means storage is not configured on this deployment:
        fall back to the inline flow.
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
            examples:
              merge_two:
                summary: Two large PDFs for merge-pdf
                value:
                  tool: merge-pdf
                  files:
                    - size: 41943040
                      content_type: application/pdf
                    - size: 73400320
                      content_type: application/pdf
      responses:
        "201":
          description: Upload created. Valid until `expires_at`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUploadResponse"
              examples:
                merge_two:
                  summary: Two presigned targets
                  value:
                    upload_id: u_Zk3p9Qx1Lm7Rt5Vb2Nc8Hd4Jf6Sg0Wa
                    expires_at: "2026-11-04T13:00:00Z"
                    files:
                      - index: 0
                        put_url: https://storage.example.com/uploads/opaque-0?signature=REDACTED
                        headers:
                          Content-Type: application/pdf
                          Content-Length: "41943040"
                      - index: 1
                        put_url: https://storage.example.com/uploads/opaque-1?signature=REDACTED
                        headers:
                          Content-Type: application/pdf
                          Content-Length: "73400320"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Unknown tool slug.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unknown_tool:
                  summary: No such tool
                  value:
                    type: urn:problem:not_found
                    title: Not found
                    status: 404
                    detail: The requested resource does not exist.
                    instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                    code: not_found
                    request_id: req_7Qk2mX9aVb4Lp1Zs
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          description: Large-file storage is not configured on this deployment. Use the inline flow.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unavailable:
                  summary: Storage not configured
                  value:
                    type: urn:problem:large_files_unavailable
                    title: Large files unavailable
                    status: 503
                    detail: Large file uploads are not available right now.
                    instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                    code: large_files_unavailable
                    request_id: req_7Qk2mX9aVb4Lp1Zs
  /api/v1/uploads/{upload_id}/run/{slug}:
    post:
      operationId: runUploadedTool
      tags: [uploads]
      summary: Run a tool on uploaded files
      description: |
        Large-file flow, step 3 of 3. Runs tool `slug` over the files of `upload_id`, in
        `files[].index` order, after the client has finished every `PUT`. The server
        verifies each object exists with the declared size, else `409 upload_incomplete`.
        Returns a short-lived `download_url` for the result instead of the file body.
        `options`, `ai_consent` and `text` mean the same as the multipart parts of the
        inline `POST /api/v1/{slug}` operation for that tool.
      x-phase: 2
      security: []
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - name: slug
          in: path
          required: true
          description: Tool slug from the catalog.
          schema:
            type: string
            pattern: "^[a-z0-9-]{1,64}$"
          example: merge-pdf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunUploadedToolRequest"
            examples:
              merge:
                summary: Merge with options
                value:
                  options:
                    keep_bookmarks: true
              empty:
                summary: No options
                value: {}
      responses:
        "200":
          description: Processed. Fetch the result from `download_url` before `expires_at`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
              examples:
                merged:
                  summary: Merge result
                  value:
                    download_url: https://storage.example.com/results/opaque-out?signature=REDACTED
                    filename: merge-pdf-result.pdf
                    media_type: application/pdf
                    size: 115343360
                    expires_at: "2026-11-04T12:30:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Unknown or expired upload, or unknown tool.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unknown_upload:
                  summary: Upload expired or unknown
                  value:
                    type: urn:problem:not_found
                    title: Not found
                    status: 404
                    detail: The requested resource does not exist.
                    instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                    code: not_found
                    request_id: req_7Qk2mX9aVb4Lp1Zs
        "409":
          description: An uploaded object is missing or its size differs from the declaration. PUT again, then retry.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                incomplete:
                  summary: Object missing or size mismatch
                  value:
                    type: urn:problem:upload_incomplete
                    title: Upload incomplete
                    status: 409
                    detail: One or more files have not been fully uploaded.
                    instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                    code: upload_incomplete
                    request_id: req_7Qk2mX9aVb4Lp1Zs
                    errors:
                      - pointer: /files/1
                        code: upload_incomplete
                        message: File not uploaded or size mismatch.
        "415":
          description: An uploaded file is not a type the tool accepts (sniffed by magic bytes). May also be returned as 400 `unsupported_type`; branch on `code`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unsupported:
                  summary: Sniffed kind not accepted
                  value:
                    type: urn:problem:unsupported_type
                    title: Unsupported file type
                    status: 415
                    detail: One of the files is not a type this tool accepts.
                    instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                    code: unsupported_type
                    request_id: req_7Qk2mX9aVb4Lp1Zs
        "422":
          description: The tool could not process the input (corrupt, encrypted, over page cap).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                processing_failed:
                  summary: Unprocessable input
                  value:
                    type: urn:problem:processing_failed
                    title: Processing failed
                    status: 422
                    detail: The file could not be processed.
                    instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                    code: processing_failed
                    request_id: req_7Qk2mX9aVb4Lp1Zs
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          description: Large-file storage is not configured or temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unavailable:
                  summary: Storage unavailable
                  value:
                    type: urn:problem:large_files_unavailable
                    title: Large files unavailable
                    status: 503
                    detail: Large file uploads are not available right now.
                    instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                    code: large_files_unavailable
                    request_id: req_7Qk2mX9aVb4Lp1Zs
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/uploads/{upload_id}:
    delete:
      operationId: deleteUpload
      tags: [uploads]
      summary: Delete an upload
      description: |
        Deletes the inputs and any outputs of the upload. Idempotent: always `204` for a
        well-formed id, whether or not it exists or has expired. Clients should call it
        when done; the server also expires uploads on its own.
      x-phase: 2
      security: []
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "204":
          description: Deleted, or nothing to delete. No body.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  parameters:
    UploadId:
      name: upload_id
      in: path
      required: true
      description: Opaque upload identifier from `createUpload`.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{32,128}$"
      example: u_Zk3p9Qx1Lm7Rt5Vb2Nc8Hd4Jf6Sg0Wa
  headers:
    RequestId:
      description: |
        Correlation id present on every response, including errors. A client may send
        its own `X-Request-Id` (8 to 64 chars of `A-Za-z0-9_-`); otherwise the server
        generates one. Never derived from user content.
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{8,64}$"
        examples: ["req_7Qk2mX9aVb4Lp1Zs"]
    CacheControlNoStore:
      description: Always `no-store` on tool, probe and error responses.
      schema:
        type: string
        const: no-store
    ETag:
      description: Entity tag of the catalog representation.
      schema:
        type: string
        examples: ['"c1a9f0d2"']
    RateLimitLimit:
      description: |
        Requests allowed in the current window for this client (IETF
        draft-ietf-httpapi-ratelimit-headers). The budget is per client IP and shared
        by all tool endpoints.
      schema:
        type: integer
        minimum: 0
        examples: [20]
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
        minimum: 0
        examples: [17]
    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer
        minimum: 0
        examples: [42]
    RetryAfter:
      description: Seconds to wait before retrying. Sent with 429.
      required: true
      schema:
        type: integer
        minimum: 1
        examples: [30]
  responses:
    BadRequest:
      description: "Bad input. Every client-side input problem is 400; branch on `code`. Never echoes filenames, content, URLs or option values."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            validation_error:
              summary: Field validation failed
              value:
                type: urn:problem:validation_error
                title: Validation failed
                status: 400
                detail: One or more fields are invalid.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: validation_error
                request_id: req_7Qk2mX9aVb4Lp1Zs
                errors:
                  - pointer: /options/angle
                    code: enum
                    message: Must be one of 90, 180, 270.
            unsupported_type:
              summary: Sniffed kind not accepted by the tool
              value:
                type: urn:problem:unsupported_type
                title: Unsupported file type
                status: 400
                detail: One of the files is not a type this tool accepts.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: unsupported_type
                request_id: req_7Qk2mX9aVb4Lp1Zs
                errors:
                  - pointer: /files/1
                    code: unsupported_type
                    message: File type not accepted.
            type_mismatch:
              summary: Mixed or contradictory kinds
              value:
                type: urn:problem:type_mismatch
                title: File types do not match
                status: 400
                detail: The files in this request are not of compatible types for this tool.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: type_mismatch
                request_id: req_7Qk2mX9aVb4Lp1Zs
            too_many_files:
              summary: More inputs than the tool allows
              value:
                type: urn:problem:too_many_files
                title: Too many files
                status: 400
                detail: The request has more files than this tool allows.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: too_many_files
                request_id: req_7Qk2mX9aVb4Lp1Zs
                params:
                  limit: 10
            too_many_pages:
              summary: Page cap exceeded
              value:
                type: urn:problem:too_many_pages
                title: Too many pages
                status: 400
                detail: The document has more pages than allowed.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: too_many_pages
                request_id: req_7Qk2mX9aVb4Lp1Zs
                params:
                  limit: 100
            invalid_file:
              summary: Corrupt or unreadable document
              value:
                type: urn:problem:invalid_file
                title: Invalid file
                status: 400
                detail: The file could not be read as a valid document.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: invalid_file
                request_id: req_7Qk2mX9aVb4Lp1Zs
            file_encrypted:
              summary: Password-protected PDF
              value:
                type: urn:problem:file_encrypted
                title: File is password protected
                status: 400
                detail: Remove the password protection and try again.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: file_encrypted
                request_id: req_7Qk2mX9aVb4Lp1Zs
            url_blocked:
              summary: URL rejected by the outbound-fetch guard
              value:
                type: urn:problem:url_blocked
                title: URL not allowed
                status: 400
                detail: This URL cannot be fetched.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: url_blocked
                request_id: req_7Qk2mX9aVb4Lp1Zs
                errors:
                  - pointer: /url_a
                    code: url_blocked
                    message: URL not allowed.
            bad_request:
              summary: Unparseable body
              value:
                type: urn:problem:bad_request
                title: Malformed request
                status: 400
                detail: The request body could not be parsed.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: bad_request
                request_id: req_7Qk2mX9aVb4Lp1Zs
    PayloadTooLarge:
      description: "The request body exceeds `limits.max_request_bytes`. The hosting platform may also emit this 413 itself, possibly with a non-problem body: clients must treat any 413 on a tool endpoint as `file_too_large`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            file_too_large:
              summary: Over the cap
              value:
                type: urn:problem:file_too_large
                title: File too large
                status: 413
                detail: The upload exceeds the maximum size.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: file_too_large
                request_id: req_7Qk2mX9aVb4Lp1Zs
                params:
                  limit_bytes: 26214400
    TooManyRequests:
      description: "Rate limited. Sends `Retry-After`. Retry automatically with backoff."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            rate_limited:
              summary: Too many requests in the window
              value:
                type: urn:problem:rate_limited
                title: Too many requests
                status: 429
                detail: Slow down and retry shortly.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: rate_limited
                request_id: req_7Qk2mX9aVb4Lp1Zs
                retry_after_seconds: 30
    ServerError:
      description: "Processing failed or unexpected failure. The body is deliberately generic: no tool stderr, exception text, paths or content. Quote `request_id` to support."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            processing_failed:
              summary: The tool could not process the input
              value:
                type: urn:problem:processing_failed
                title: Processing failed
                status: 500
                detail: The file could not be processed.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: processing_failed
                request_id: req_7Qk2mX9aVb4Lp1Zs
            internal_error:
              summary: Unexpected failure
              value:
                type: urn:problem:internal_error
                title: Internal error
                status: 500
                detail: Something went wrong. Quote the request id if you contact support.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: internal_error
                request_id: req_7Qk2mX9aVb4Lp1Zs
    BadGateway:
      description: "A web page to compare could not be fetched (unreachable, timed out, too large or wrong content type). Only on `compare-sites`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            upstream_fetch_failed:
              summary: Fetch of a submitted URL failed
              value:
                type: urn:problem:upstream_fetch_failed
                title: Could not fetch the page
                status: 502
                detail: One of the pages could not be fetched.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: upstream_fetch_failed
                request_id: req_7Qk2mX9aVb4Lp1Zs
                errors:
                  - pointer: /url_b
                    code: upstream_fetch_failed
                    message: Page could not be fetched.
    GatewayTimeout:
      description: "The platform time budget for the function was exhausted. Retrying the same input will usually time out again: try a smaller file or fewer pages."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            processing_timeout:
              summary: Out of time
              value:
                type: urn:problem:processing_timeout
                title: Processing timed out
                status: 504
                detail: The operation took too long.
                instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
                code: processing_timeout
                request_id: req_7Qk2mX9aVb4Lp1Zs
  schemas:
    ErrorCode:
      description: |
        Stable machine-readable error codes (the `code` of every `Problem`). New codes
        may be added (additive); clients treat an unknown code as a generic failure of
        the matching HTTP class. HTTP status per code: 400 bad_request, validation_error,
        too_many_files, too_many_pages, unsupported_type, type_mismatch, invalid_file,
        file_encrypted, url_blocked; 404 not_found; 413 file_too_large; 429 rate_limited;
        409 upload_incomplete; 415 unsupported_type (large-file run); 422 processing_failed (large-file run); 500 processing_failed, internal_error; 503 large_files_unavailable; 502 upstream_fetch_failed; 504
        processing_timeout.
      type: string
      enum:
        - bad_request
        - validation_error
        - file_too_large
        - too_many_files
        - too_many_pages
        - unsupported_type
        - type_mismatch
        - invalid_file
        - file_encrypted
        - url_blocked
        - rate_limited
        - upstream_fetch_failed
        - processing_failed
        - processing_timeout
        - internal_error
        - not_found
        - large_files_unavailable
        - upload_incomplete
      examples: [file_too_large]
    FieldError:
      description: One field-level problem inside a `Problem.errors` list.
      type: object
      additionalProperties: false
      required: [pointer, code, message]
      properties:
        pointer:
          description: JSON Pointer (RFC 6901) to the offending part of the request, such as `/options/angle` or `/files/1`. Never contains user-supplied values.
          type: string
          maxLength: 200
          examples: ["/options/angle"]
        code:
          description: Short machine code for the rule that failed (a validation keyword such as `enum`, `required`, `max_length`, or an `ErrorCode`).
          type: string
          maxLength: 64
          examples: [enum]
        message:
          description: Human-readable text. Not stable, do not branch on it. Never echoes user input.
          type: string
          maxLength: 300
          examples: ["Must be one of 90, 180, 270."]
      examples:
        - pointer: /options/angle
          code: enum
          message: Must be one of 90, 180, 270.
    ProblemParamValue:
      description: A scalar value in `Problem.params`.
      oneOf:
        - type: string
          maxLength: 100
        - type: integer
        - type: boolean
      examples: [free, 26214400]
    ProblemParams:
      description: Small machine-readable context for the code, such as `limit_bytes` or `limit`. Scalar values only.
      type: object
      additionalProperties:
        $ref: "#/components/schemas/ProblemParamValue"
      examples:
        - limit_bytes: 26214400
    Problem:
      description: |
        RFC 9457 problem details, the single error envelope for every non-2xx response
        (except the `/ready` 503 body). Media type `application/problem+json`.
        `title` and `detail` come from a fixed table per `code`: they never contain raw
        exception text, tool output, filenames, document content, submitted URLs or
        option values. Field-level problems use `errors[].pointer`.
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type:
          description: URI reference identifying the problem type. Always `urn:problem:{code}`. Informational, branch on `code`.
          type: string
          format: uri-reference
          maxLength: 100
          examples: ["urn:problem:file_too_large"]
        title:
          description: Short summary. Same for every occurrence of the same `code`.
          type: string
          maxLength: 120
          examples: [File too large]
        status:
          description: HTTP status code, repeated for convenience.
          type: integer
          minimum: 400
          maximum: 599
          examples: [413]
        detail:
          description: Occurrence-specific explanation from the fixed table, safe to show to the user.
          type: string
          maxLength: 500
          examples: [The upload exceeds the maximum size.]
        instance:
          description: Identifies this occurrence as `urn:request:{request_id}`.
          type: string
          format: uri-reference
          maxLength: 100
          examples: ["urn:request:req_7Qk2mX9aVb4Lp1Zs"]
        code:
          $ref: "#/components/schemas/ErrorCode"
        request_id:
          description: Same value as the `X-Request-Id` response header.
          type: string
          pattern: "^[A-Za-z0-9_-]{8,64}$"
          examples: [req_7Qk2mX9aVb4Lp1Zs]
        errors:
          description: Field-level problems (validation_error, unsupported_type, url_blocked, upstream_fetch_failed).
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/FieldError"
          examples:
            - - pointer: /options/angle
                code: enum
                message: Must be one of 90, 180, 270.
        retry_after_seconds:
          description: Same value as the `Retry-After` header, repeated for clients that cannot read headers cross-origin. Present with 429.
          type: integer
          minimum: 1
          examples: [30]
        params:
          $ref: "#/components/schemas/ProblemParams"
      examples:
        - type: urn:problem:file_too_large
          title: File too large
          status: 413
          detail: The upload exceeds the maximum size.
          instance: urn:request:req_7Qk2mX9aVb4Lp1Zs
          code: file_too_large
          request_id: req_7Qk2mX9aVb4Lp1Zs
          params:
            limit_bytes: 26214400
    Health:
      description: Liveness body.
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
          examples: [ok]
      examples:
        - status: ok
    CheckState:
      description: Outcome of one readiness check. Fixed vocabulary, never error text.
      type: string
      enum: [ok, failed, not_configured]
      examples: [ok]
    ReadinessStatus:
      description: Overall readiness.
      type: string
      enum: [ready, not_ready]
      examples: [ready]
    ReadinessChecks:
      description: Per-dependency outcomes.
      type: object
      additionalProperties: false
      required: [rate_limiter]
      properties:
        rate_limiter:
          $ref: "#/components/schemas/CheckState"
      examples:
        - rate_limiter: ok
    Readiness:
      description: Readiness body. No versions, hostnames or secrets.
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          $ref: "#/components/schemas/ReadinessStatus"
        checks:
          $ref: "#/components/schemas/ReadinessChecks"
      examples:
        - status: ready
          checks:
            rate_limiter: ok
    Limits:
      description: Global request limits. Values come from server settings, never hard-coded by clients. Use them for UI hints and pre-flight checks only, the server enforces.
      type: object
      additionalProperties: false
      required: [max_request_bytes, max_pages, large_files_enabled, max_large_file_bytes, max_large_total_bytes, inline_max_bytes]
      properties:
        max_request_bytes:
          description: Maximum size of the whole request body in bytes (all files plus options). Recommended default 26214400 (25 MB), subject to the hosting platform payload limit.
          type: integer
          minimum: 1
          examples: [26214400]
        max_pages:
          description: Maximum pages per PDF document.
          type: integer
          minimum: 1
          examples: [100]
        large_files_enabled:
          description: True when the large-file flow (`/api/v1/uploads`) is available on this deployment.
          type: boolean
          examples: [true]
        max_large_file_bytes:
          description: Maximum size of one file in the large-file flow, in bytes.
          type: integer
          minimum: 1
          examples: [524288000]
        max_large_total_bytes:
          description: Maximum total size of all files of one upload, in bytes.
          type: integer
          minimum: 1
          examples: [1073741824]
        inline_max_bytes:
          description: Largest total size the inline multipart flow accepts. Above this, use the large-file flow.
          type: integer
          minimum: 1
          examples: [4194304]
      examples:
        - max_request_bytes: 26214400
          max_pages: 100
          large_files_enabled: true
          max_large_file_bytes: 524288000
          max_large_total_bytes: 1073741824
          inline_max_bytes: 4194304
    CreateUploadFile:
      description: One file to be uploaded. Only size and declared type; the real type is sniffed at run time.
      type: object
      additionalProperties: false
      required: [size, content_type]
      properties:
        size:
          description: Exact size in bytes. The `PUT` must send exactly this many bytes.
          type: integer
          minimum: 1
          examples: [41943040]
        content_type:
          description: Declared media type. Must be one the tool accepts (`Tool.accepts`).
          type: string
          enum: [application/pdf, image/jpeg, image/png, image/webp, image/tiff]
          examples: [application/pdf]
      examples:
        - size: 41943040
          content_type: application/pdf
    CreateUploadRequest:
      description: Declares the files of one large-file run.
      type: object
      additionalProperties: false
      required: [tool, files]
      properties:
        tool:
          description: Slug of the tool the files are for.
          type: string
          pattern: "^[a-z0-9-]{1,64}$"
          examples: [merge-pdf]
        files:
          description: Files in processing order, 1 to 20.
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/CreateUploadFile"
      examples:
        - tool: merge-pdf
          files:
            - size: 41943040
              content_type: application/pdf
    UploadTarget:
      description: Where and how to upload one file.
      type: object
      additionalProperties: false
      required: [index, put_url, headers]
      properties:
        index:
          description: Zero-based position in the request `files` array.
          type: integer
          minimum: 0
          maximum: 19
          examples: [0]
        put_url:
          description: Presigned URL. `PUT` the raw file bytes here. Treat as a secret, do not log.
          type: string
          format: uri
          examples: ["https://storage.example.com/uploads/opaque-0?signature=REDACTED"]
        headers:
          description: Headers the client MUST send on the `PUT`, including `Content-Type` and `Content-Length`. Anything else breaks the signature.
          type: object
          additionalProperties:
            type: string
          examples:
            - Content-Type: application/pdf
              Content-Length: "41943040"
      examples:
        - index: 0
          put_url: https://storage.example.com/uploads/opaque-0?signature=REDACTED
          headers:
            Content-Type: application/pdf
            Content-Length: "41943040"
    CreateUploadResponse:
      description: Upload handle and one presigned target per declared file.
      type: object
      additionalProperties: false
      required: [upload_id, expires_at, files]
      properties:
        upload_id:
          description: Opaque url-safe identifier, at least 32 characters. Server-generated.
          type: string
          pattern: "^[A-Za-z0-9_-]{32,128}$"
          examples: [u_Zk3p9Qx1Lm7Rt5Vb2Nc8Hd4Jf6Sg0Wa]
        expires_at:
          description: After this instant the presigned URLs and the upload are invalid.
          type: string
          format: date-time
          examples: ["2026-11-04T13:00:00Z"]
        files:
          description: One target per request file, same order.
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/UploadTarget"
      examples:
        - upload_id: u_Zk3p9Qx1Lm7Rt5Vb2Nc8Hd4Jf6Sg0Wa
          expires_at: "2026-11-04T13:00:00Z"
          files:
            - index: 0
              put_url: https://storage.example.com/uploads/opaque-0?signature=REDACTED
              headers:
                Content-Type: application/pdf
                Content-Length: "41943040"
    RunUploadedToolRequest:
      description: Options for running a tool over uploaded files. All members optional.
      type: object
      additionalProperties: false
      properties:
        options:
          description: The tool options object (shape named by `Tool.options_schema`). Unknown keys are rejected with `validation_error`.
          type: object
          additionalProperties: true
          examples:
            - keep_bookmarks: true
        ai_consent:
          description: Explicit consent to AI processing, for tools that need it.
          type: boolean
          examples: [false]
        text:
          description: Free text input, for tools that take it.
          type: string
          maxLength: 100000
          examples: [Add this text]
      examples:
        - options:
            keep_bookmarks: true
    UploadResult:
      description: A processed result held in storage for a short time.
      type: object
      additionalProperties: false
      required: [download_url, filename, media_type, size, expires_at]
      properties:
        download_url:
          description: Short-lived presigned `GET` URL. Treat as a secret, do not log.
          type: string
          format: uri
          examples: ["https://storage.example.com/results/opaque-out?signature=REDACTED"]
        filename:
          description: Suggested filename, same pattern as the inline flow.
          type: string
          maxLength: 255
          examples: [merge-pdf-result.pdf]
        media_type:
          description: Media type of the result.
          type: string
          maxLength: 100
          examples: [application/pdf]
        size:
          description: Result size in bytes.
          type: integer
          minimum: 0
          examples: [115343360]
        expires_at:
          description: After this instant `download_url` stops working.
          type: string
          format: date-time
          examples: ["2026-11-04T12:30:00Z"]
      examples:
        - download_url: https://storage.example.com/results/opaque-out?signature=REDACTED
          filename: merge-pdf-result.pdf
          media_type: application/pdf
          size: 115343360
          expires_at: "2026-11-04T12:30:00Z"
    ToolList:
      description: The catalog plus the global limits.
      type: object
      additionalProperties: false
      required: [items, limits]
      properties:
        items:
          description: Catalog entries in display order.
          type: array
          items:
            $ref: "#/components/schemas/Tool"
          examples:
            - - slug: merge-pdf
                category: organize
                title: Merge PDF
                description: Combine several PDF files into one document, in the order you choose.
                icon: combine
                input_kinds: [file]
                accepts: [application/pdf]
                min_inputs: 2
                max_inputs: 10
                options_schema: MergePdfOptions
                output_kind: pdf
                status: available
                phase: 2
                seo:
                  title: Merge PDF files online, without keeping them
                  description: Combine PDF files into one in seconds. Your files are never stored, the result comes straight back in the response.
                  keywords: [merge pdf, combine pdf]
        limits:
          $ref: "#/components/schemas/Limits"
      examples:
        - items: []
          limits:
            max_request_bytes: 26214400
            max_pages: 100
            large_files_enabled: true
            max_large_file_bytes: 524288000
            max_large_total_bytes: 1073741824
            inline_max_bytes: 4194304
    ToolCategory:
      description: Catalog grouping. Adding a category is a minor, additive change; clients must render unknown
        categories gracefully.
      type: string
      enum:
      - organize
      - optimize
      - convert-to-pdf
      - convert-from-pdf
      - compare
      examples:
      - organize
    InputKind:
      description: Kind of input a tool accepts. file = multipart upload, url = web page address in a JSON
        body.
      type: string
      enum:
      - file
      - url
      examples:
      - file
    OutputKind:
      description: What a successful response carries. pdf, zip and txt are attachments; json is an inline
        JSON body.
      type: string
      enum:
      - pdf
      - zip
      - txt
      - json
      examples:
      - pdf
    ToolStatus:
      description: available = the endpoint exists and works. coming_soon = listed for SEO and roadmap; the
        endpoint does not exist yet (framework 404).
      type: string
      enum:
      - available
      - coming_soon
      examples:
      - coming_soon
    ToolFaqItem:
      description: One FAQ entry.
      type: object
      additionalProperties: false
      required:
      - question
      - answer
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 200
          examples:
          - Are my files stored after merging?
        answer:
          type: string
          minLength: 1
          maxLength: 1000
          examples:
          - No. The file is processed in memory and the result is returned in the same request. Nothing is
            saved on our servers.
      examples:
      - question: Are my files stored after merging?
        answer: No. The file is processed in memory and the result is returned in the same request. Nothing
          is saved on our servers.
    ToolSeo:
      description: Search and landing-page metadata.
      type: object
      additionalProperties: false
      required:
      - title
      - description
      - keywords
      properties:
        title:
          description: HTML title tag.
          type: string
          minLength: 1
          maxLength: 70
          examples:
          - Merge PDF files online, without keeping them
        description:
          description: Meta description.
          type: string
          minLength: 1
          maxLength: 170
          examples:
          - 'Combine PDF files into one in seconds. Your files are never stored: the result comes straight
            back in the response.'
        keywords:
          description: Target search phrases.
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 60
          minItems: 1
          maxItems: 15
          uniqueItems: true
          examples:
          - - merge pdf
            - combine pdf
            - join pdf files
        faq:
          description: Optional FAQ entries rendered on the landing page and as structured data.
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ToolFaqItem'
      examples:
      - title: Merge PDF files online, without keeping them
        description: 'Combine PDF files into one in seconds. Your files are never stored: the result comes
          straight back in the response.'
        keywords:
        - merge pdf
        - combine pdf
    Tool:
      description: One tool in the catalog. Its endpoint is POST /api/v1/{slug}.
      type: object
      additionalProperties: false
      required:
      - slug
      - category
      - title
      - description
      - icon
      - input_kinds
      - accepts
      - min_inputs
      - max_inputs
      - options_schema
      - output_kind
      - status
      - phase
      - seo
      properties:
        slug:
          description: Stable kebab-case identifier. It is both the URL path segment (POST /api/v1/{slug})
            and the landing-page route (/tools/{slug}). Never reused for a different tool.
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          minLength: 3
          maxLength: 64
          examples:
          - merge-pdf
        category:
          $ref: '#/components/schemas/ToolCategory'
        title:
          description: Display name.
          type: string
          minLength: 1
          maxLength: 60
          examples:
          - Merge PDF
        description:
          description: One-sentence summary for cards and listings.
          type: string
          minLength: 1
          maxLength: 200
          examples:
          - Combine several PDF files into one document, in the order you choose.
        icon:
          description: Lucide icon name (kebab-case).
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 40
          examples:
          - combine
        input_kinds:
          description: Kinds of input accepted. File tools are [file]; site comparison is [url].
          type: array
          items:
            $ref: '#/components/schemas/InputKind'
          minItems: 1
          uniqueItems: true
          examples:
          - - file
        accepts:
          description: 'MIME types accepted when input_kinds contains `file`. Informational for the UI file
            picker: the server decides by magic-byte sniffing and ignores the client Content-Type. Empty when
            no file input.'
          type: array
          items:
            type: string
            pattern: ^[a-z0-9]+/[a-z0-9.+-]+$
            maxLength: 127
          uniqueItems: true
          maxItems: 20
          examples:
          - - application/pdf
        min_inputs:
          description: Minimum number of inputs (files or URLs) per request.
          type: integer
          minimum: 1
          maximum: 100
          examples:
          - 2
        max_inputs:
          description: Maximum number of inputs per request. Exceeding it returns too_many_files.
          type: integer
          minimum: 1
          maximum: 100
          examples:
          - 10
        options_schema:
          description: Name of the schema under components.schemas of shared/openapi.yaml that describes this
            tool's `options` object, or null when the tool takes no options.
          type:
          - string
          - 'null'
          pattern: ^[A-Z][A-Za-z0-9]*Options$
          maxLength: 64
          examples:
          - MergePdfOptions
          - null
        output_kind:
          $ref: '#/components/schemas/OutputKind'
        status:
          $ref: '#/components/schemas/ToolStatus'
        phase:
          description: Delivery phase in which the tool becomes available. Informational (roadmap and coming-soon
            UI).
          type: integer
          minimum: 1
          maximum: 10
          examples:
          - 2
        seo:
          $ref: '#/components/schemas/ToolSeo'
      examples:
      - slug: compare-sites
        category: compare
        title: Compare two web pages
        description: Fetch two public web pages and see exactly what differs between them.
        icon: git-compare
        input_kinds:
        - url
        accepts: []
        min_inputs: 2
        max_inputs: 2
        options_schema: CompareSitesOptions
        output_kind: json
        status: coming_soon
        phase: 3
        seo:
          title: Compare two web pages and see the differences
          description: Paste two URLs and get a line-by-line diff of their text content. Nothing is stored.
          keywords:
          - compare websites
          - webpage diff
    PageRange:
      description: Comma-separated 1-based pages and ranges, such as `1-3,5,8-10`. Pages beyond the document are `400 validation_error`.
      type: string
      pattern: "^[0-9]+(-[0-9]+)?(,[0-9]+(-[0-9]+)?)*$"
      minLength: 1
      maxLength: 200
      examples: ["1-3,5,8-10"]
    MergePdfOptions:
      description: Options for `merge-pdf`.
      type: object
      additionalProperties: false
      properties:
        keep_bookmarks:
          description: Preserve each source document's outline.
          type: boolean
          default: true
          examples: [true]
      examples:
        - keep_bookmarks: true
    SplitPdfOptions:
      description: Options for `split-pdf`. Exactly one of `ranges` or `every_n` is required (otherwise `validation_error`).
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        ranges:
          $ref: "#/components/schemas/PageRange"
        every_n:
          description: Split into parts of this many pages each.
          type: integer
          minimum: 1
          maximum: 500
          examples: [10]
      examples:
        - ranges: "1-3,5,8-10"
        - every_n: 10
    OrganizePdfOptions:
      description: Options for `organize-pdf`.
      type: object
      additionalProperties: false
      required: [page_order]
      properties:
        page_order:
          description: 1-based source pages in their new order. A page that is absent is removed, a page listed twice is duplicated.
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: integer
            minimum: 1
            maximum: 500
          examples:
            - [3, 1, 2, 2]
      examples:
        - page_order: [3, 1, 2, 2]
    RotationAngle:
      description: Clockwise rotation in degrees.
      type: integer
      enum: [90, 180, 270]
      examples: [90]
    RotatePdfOptions:
      description: Options for `rotate-pdf`.
      type: object
      additionalProperties: false
      required: [angle]
      properties:
        angle:
          $ref: "#/components/schemas/RotationAngle"
        pages:
          description: Pages to rotate. Omit for all pages.
          allOf:
            - $ref: "#/components/schemas/PageRange"
      examples:
        - angle: 90
          pages: "1-3"
    CompressionLevel:
      description: Trade-off between size and quality.
      type: string
      enum: [low, medium, high]
      default: medium
      examples: [medium]
    CompressPdfOptions:
      description: Options for `compress-pdf`.
      type: object
      additionalProperties: false
      properties:
        level:
          $ref: "#/components/schemas/CompressionLevel"
      examples:
        - level: medium
    PageSize:
      description: Target page size. `fit` sizes each page to its image.
      type: string
      enum: [a4, letter, fit]
      default: a4
      examples: [a4]
    PageOrientation:
      description: Page orientation. `auto` follows each image.
      type: string
      enum: [auto, portrait, landscape]
      default: auto
      examples: [auto]
    ImageToPdfOptions:
      description: Options for `image-to-pdf`.
      type: object
      additionalProperties: false
      properties:
        page_size:
          $ref: "#/components/schemas/PageSize"
        orientation:
          $ref: "#/components/schemas/PageOrientation"
        margin_mm:
          type: integer
          minimum: 0
          maximum: 50
          default: 10
          examples: [10]
      examples:
        - page_size: a4
          orientation: auto
          margin_mm: 10
    ImageFormat:
      description: Output image format.
      type: string
      enum: [png, jpg]
      default: png
      examples: [png]
    PdfToImagesOptions:
      description: Options for `pdf-to-images`.
      type: object
      additionalProperties: false
      properties:
        format:
          $ref: "#/components/schemas/ImageFormat"
        dpi:
          type: integer
          minimum: 72
          maximum: 300
          default: 150
          examples: [150]
        pages:
          $ref: "#/components/schemas/PageRange"
      examples:
        - format: png
          dpi: 150
    ExtractTextOptions:
      description: Options for `extract-text`.
      type: object
      additionalProperties: false
      properties:
        pages:
          description: Pages to extract. Omit for all pages.
          allOf:
            - $ref: "#/components/schemas/PageRange"
      examples:
        - pages: "1-5"
    CompareGranularity:
      description: Unit of comparison for the diff.
      type: string
      enum: [word, line]
      default: line
      examples: [line]
    CompareSitesOptions:
      description: Options for `compare-sites`.
      type: object
      additionalProperties: false
      properties:
        ignore_whitespace:
          type: boolean
          default: true
          examples: [true]
        granularity:
          $ref: "#/components/schemas/CompareGranularity"
      examples:
        - ignore_whitespace: true
          granularity: line
    MergePdfRequest:
      description: Multipart body of `POST /api/v1/merge-pdf`. Part names are exactly the property names. Unknown parts are rejected with `validation_error`.
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          description: "PDF files in significant order (2 to 10)."
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: string
            format: binary
          examples:
            - ["<binary PDF bytes>", "<binary PDF bytes>"]
        options:
          description: Optional JSON object sent as a part with Content-Type `application/json`, shaped as `MergePdfOptions`. Omit for defaults.
          type: string
          contentMediaType: application/json
          contentSchema:
            $ref: "#/components/schemas/MergePdfOptions"
          examples: ['{"keep_bookmarks":true}']
      examples:
