openapi: 3.1.0
info:
  title: Document Tools API
  version: 2.0.0
  summary: Wire contract for the privacy-first, synchronous document tools service.
  description: |
    FROZEN contract. Frontend and backend implement against this file in parallel.
    A gap found by an implementer comes back to the api-designer; nobody patches
    generated code or this file ad hoc.

    **Model.** One synchronous `POST /api/v1/{tool-slug}` per tool. The request carries
    the input (multipart files, or a JSON body for site comparison) and the response
    carries the result in the same HTTP exchange. There are no jobs, no polling, no
    tokens, no tickets and no presigned URLs. Nothing is stored: the input is processed
    in memory (or a request-scoped temp dir) and discarded before the response ends.

    **Auth.** None in this version (anonymous only). Adding optional authentication
    later is an additive change (new optional security scheme and header).

    **Privacy.** No response, error or log field carries a filename, document content,
    a submitted URL or option values. Part filenames are discarded on receipt. Result
    filenames are generated (`{tool-slug}-result.{ext}`).

    **Compatibility rules (v1 path).** Additive changes are safe: new optional request
    fields, new response fields, new enum values in response-only enums (`ToolCategory`,
    `OutputKind`, `ErrorCode`), new tool endpoints, new `*Options` schemas. Clients MUST
    ignore unknown response properties and unknown enum values. Removing or renaming a
    field, tightening a type or changing semantics requires `/api/v2`. `oasdiff breaking`
    runs in CI against the previous committed spec. The `info.version` here is the
    contract revision (2.0.0 is the synchronous refreeze); the URL stays `/api/v1`
    because no v1 job API was ever released.

    **Conventions.** JSON `snake_case`. Timestamps RFC 3339 UTC. Sizes in bytes.
    Errors are always `application/problem+json` (RFC 9457) with a stable `code`.
    Clients branch on `code`, never on `title` or `detail`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.{apex}
    description: Production.
    variables:
      apex:
        default: example.com
        description: Registrable domain of the deployment.
  - url: http://localhost:8000
    description: Local development
tags:
  - name: health
    description: Liveness and readiness probes. Unversioned, no secrets in output.
  - name: catalog
    description: Public tool catalog.
  - name: pdf
    description: Synchronous PDF and image tools. Multipart request, file response.
  - name: web
    description: Synchronous web page tools. JSON request, JSON response.
  - name: uploads
    description: Large-file flow. Presigned direct-to-storage upload, then run a tool by upload id and download the result from a short-lived URL.
security: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      description: Returns 200 whenever the process is up. Checks no dependency.
      x-phase: 1
      security: []
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  summary: Alive
                  value:
                    status: ok
  /ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Readiness probe
      description: |
        Checks the rate-limit store when one is configured. Output is the fixed
        vocabulary `ok | failed | not_configured`: no versions, hostnames, error text
        or secrets. 503 when a configured dependency fails.
      x-phase: 1
      security: []
      responses:
        "200":
          description: All configured dependencies are reachable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              examples:
                ready:
                  summary: Ready
                  value:
                    status: ready
                    checks:
                      rate_limiter: ok
                no_store_configured:
                  summary: In-memory rate limiting
                  value:
                    status: ready
                    checks:
                      rate_limiter: not_configured
        "503":
          description: A configured dependency is failing. Same body shape as 200 (not problem+json) so probes can parse it.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              examples:
                not_ready:
                  summary: Rate-limit store down
                  value:
                    status: not_ready
                    checks:
                      rate_limiter: failed
  /api/v1/tools:
    get:
      operationId: listTools
      tags: [catalog]
      summary: List the tool catalog
      description: |
        Returns the whole catalog (bounded, about a dozen entries, so deliberately not
        paginated) in catalog order, plus the global limits. Optional filters narrow
        the list. Cacheable: carries an `ETag` and honours `If-None-Match` with 304.
        A tool with `status: available` is callable at `POST /api/v1/{slug}`.
      x-phase: 1
      security: []
      parameters:
        - name: category
          in: query
          required: false
          description: Return only tools in this category.
          schema:
            $ref: "#/components/schemas/ToolCategory"
          example: organize
        - name: status
          in: query
          required: false
          description: Return only tools with this status.
          schema:
            $ref: "#/components/schemas/ToolStatus"
          example: available
        - name: If-None-Match
          in: header
          required: false
          description: ETag from a previous response.
          schema:
            type: string
            maxLength: 200
          example: '"c1a9f0d2"'
      responses:
        "200":
          description: The catalog.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              description: Public caching is allowed for catalog data.
              schema:
                type: string
                examples: ["public, max-age=300"]
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolList"
              examples:
                phase1_all_coming_soon:
                  summary: Phase 1, every tool coming soon
                  value:
                    items:
                      - slug: merge-pdf
                        category: organize
                        title: Merge PDF
                        description: Combine several PDF files into one document, in the order you choose.
                        icon: combine
                        input_kinds: [file]
                        accepts: [application/pdf]
                        min_inputs: 2
                        max_inputs: 10
                        options_schema: MergePdfOptions
                        output_kind: pdf
                        status: available
                        phase: 2
                        seo:
                          title: Merge PDF files online, without keeping them
                          description: Combine PDF files into one in seconds. Your files are never stored, the result comes straight back in the response.
                          keywords: [merge pdf, combine pdf, join pdf files]
                      - slug: compare-sites
                        category: compare
                        title: Compare two web pages
                        description: Fetch two public web pages and see exactly what differs between them.
                        icon: git-compare
                        input_kinds: [url]
                        accepts: []
                        min_inputs: 2
                        max_inputs: 2
                        options_schema: CompareSitesOptions
                        output_kind: json
                        status: coming_soon
                        phase: 3
                        seo:
                          title: Compare two web pages and see the differences
                          description: Paste two URLs and get a line-by-line diff of their text content. Nothing is stored.
                          keywords: [compare websites, webpage diff]
                    limits:
                      max_request_bytes: 26214400
                      max_pages: 100
                      large_files_enabled: true
                      max_large_file_bytes: 524288000
                      max_large_total_bytes: 1073741824
                      inline_max_bytes: 4194304
        "304":
          description: Catalog unchanged since the supplied ETag. No body.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/merge-pdf:
    post:
      operationId: mergePdf
      tags: [pdf]
      summary: Merge PDF files
      description: |
        Concatenates the uploaded PDFs, in upload order, into one PDF. 2 to 10 files.

        Synchronous: the result is the response body (`200`), delivered as
        `Content-Disposition: attachment; filename="merge-pdf-result.pdf"`. The `options` part is an
        optional JSON object (part Content-Type `application/json`) whose shape is
        `MergePdfOptions`; unknown keys are rejected with `validation_error`.
        Part filenames and part Content-Types are ignored: the server sniffs magic bytes.
        The whole request body is capped at `limits.max_request_bytes` from `GET /api/v1/tools`.
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MergePdfRequest"
            encoding:
              options:
                contentType: application/json
            examples:
              basic:
                summary: Typical request
                value:
                  files:
                    - "<binary PDF bytes>"
                    - "<binary PDF bytes>"
                  options: "{\"keep_bookmarks\":true}"
      responses:
        "200":
          description: The processed result, as an attachment.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Content-Disposition:
              description: Always `attachment` with a generated filename.
              required: true
              schema:
                type: string
                pattern: '^attachment; filename="[a-z0-9-]+-result\.[a-z0-9]+"$'
                examples: ['attachment; filename="merge-pdf-result.pdf"']
            Content-Length:
              description: Result size in bytes.
              schema:
                type: integer
                minimum: 0
                examples: [1048576]
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                examples: ["<binary result bytes>"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
