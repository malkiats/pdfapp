    CompareSitesRequest:
      description: JSON body of `POST /api/v1/compare-sites`.
      type: object
      additionalProperties: false
      required: [url_a, url_b]
      properties:
        url_a:
          description: First page. Absolute http or https URL, at most 2048 characters, no credentials, port 80 or 443 only.
          type: string
          format: uri
          maxLength: 2048
          examples: ["https://example.org/pricing"]
        url_b:
          description: Second page, same rules as `url_a`.
          type: string
          format: uri
          maxLength: 2048
          examples: ["https://example.org/pricing-new"]
        options:
          $ref: "#/components/schemas/CompareSitesOptions"
      examples:
        - url_a: https://example.org/pricing
          url_b: https://example.org/pricing-new
          options:
            ignore_whitespace: true
            granularity: line
    DiffOp:
      description: Kind of a diff entry.
      type: string
      enum: [equal, add, remove]
      examples: [add]
    DiffEntry:
      description: One diff unit (a line or a word, per `granularity`). `text` is page content, returned only to the requester and never logged.
      type: object
      additionalProperties: false
      required: [op, text]
      properties:
        op:
          $ref: "#/components/schemas/DiffOp"
        text:
          type: string
          maxLength: 5000
          examples: [Pro plan 6.99 USD per month]
      examples:
        - op: add
          text: Pro plan 6.99 USD per month
    DiffSummary:
      description: Counts over the full diff, including entries cut by truncation.
      type: object
      additionalProperties: false
      required: [added, removed, unchanged, similarity]
      properties:
        added:
          type: integer
          minimum: 0
          examples: [1]
        removed:
          type: integer
          minimum: 0
          examples: [1]
        unchanged:
          type: integer
          minimum: 0
          examples: [2]
        similarity:
          description: Similarity ratio, 0 (nothing in common) to 1 (identical).
          type: number
          minimum: 0
          maximum: 1
          examples: [0.67]
      examples:
        - added: 1
          removed: 1
          unchanged: 2
          similarity: 0.67
    CompareSitesResult:
      description: Diff of the visible text of the two pages. The response is capped by a server setting (`truncated` reports a cut).
      type: object
      additionalProperties: false
      required: [summary, diff, truncated]
      properties:
        summary:
          $ref: "#/components/schemas/DiffSummary"
        diff:
          type: array
          maxItems: 20000
          items:
            $ref: "#/components/schemas/DiffEntry"
          examples:
            - - op: equal
                text: Pricing
              - op: remove
                text: Pro plan 5.99 USD per month
              - op: add
                text: Pro plan 6.99 USD per month
        truncated:
          description: True when `diff` was cut at the server cap. `summary` still covers the full diff.
          type: boolean
          examples: [false]
      examples:
        - summary:
            added: 1
            removed: 1
            unchanged: 2
            similarity: 0.67
          diff:
            - op: equal
              text: Pricing
            - op: remove
              text: Pro plan 5.99 USD per month
            - op: add
              text: Pro plan 6.99 USD per month
            - op: equal
              text: Cancel any time
          truncated: false
