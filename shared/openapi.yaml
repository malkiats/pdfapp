      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/OrganizePdfRequest"
            encoding:
              options:
                contentType: application/json
            examples:
              basic:
                summary: Typical request
