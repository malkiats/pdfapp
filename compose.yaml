# Local development stack. `make dev` (or `docker compose up --build`) brings up
# valkey, api, worker-docs, worker-web, worker-ai and sweeper.
#
# Optional profiles:
#   --profile db        postgres 16 (Phase 4+: plans, subscriptions, usage)
#   --profile mock      Prism mock of shared/openapi.yaml on :4010
#   --profile frontend  Next.js dev server on :3000 (hot reload)
#
# Sandboxing follows docs/architecture.md §7 and docs/security.md §7:
# non-root UID 10001, read-only rootfs, cap_drop ALL, no-new-privileges,
# tmpfs scratch, pids/mem/cpu limits, and network separation by egress profile.
#
# Networks:
#   internal  internal: true -> NO route out of the host. Every backend service
#             is on it; worker-docs, sweeper, valkey and postgres are ONLY on it.
#   egress    normal bridge -> outbound internet and host port publishing.
#             api (Supabase JWKS, payments later), worker-web (SSRF-guarded fetch),
#             worker-ai (Groq), mock and frontend.
#
# All published ports bind to 127.0.0.1 only.

name: doctools

# ---------------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------------
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-backend: &backend
  <<: *hardening
  image: doctools-backend:dev
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: runtime
    additional_contexts:
      shared: ./shared
  user: "10001:10001"
  env_file:
    - path: .env
      required: false
  # Values below are container-topology facts and override .env on purpose,
  # so .env can also be used to run the backend directly on the host.
  environment: &backend-env
    APP_REDIS__URL: redis://valkey:6379/0
    APP_STORAGE__BACKEND: local
    APP_STORAGE__ROOT: /data/workspaces
    APP_STORAGE__WORK_DIR: /work
  volumes:
    - workspaces:/data/workspaces
  tmpfs:
    - /tmp:size=64m,mode=1777
  restart: unless-stopped
  depends_on:
    valkey:
      condition: service_healthy

services:
  # -------------------------------------------------------------------------
  # Queue + job state. No persistence at all (ADR-0002 §7: no snapshots/AOF,
  # temp data is never backed up). A restart drops queued jobs by design.
  # -------------------------------------------------------------------------
  valkey:
    <<: *hardening
    image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    user: "999:1000" # valkey user in the alpine image; skips the root entrypoint path
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --protected-mode
      - "no" # only reachable on the internal network, never published
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - noeviction # RQ must never lose queue keys silently
    tmpfs:
      - /data:size=16m,uid=999,gid=1000,mode=0700
      - /tmp:size=8m
    networks: [internal]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # User/billing data (Phase 4+). NOT documents: Postgres never stores
  # filenames, content, OCR text, prompts or URLs (architecture.md §3).
  # -------------------------------------------------------------------------
  postgres:
    <<: *hardening
    profiles: [db]
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    user: "70:70" # postgres user in the alpine image
    # Only the variables postgres needs, not the whole .env.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doctools}
      POSTGRES_USER: ${POSTGRES_USER:-doctools}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:size=1m,uid=70,gid=70
      - /tmp:size=64m,mode=1777
    networks: [internal]
    shm_size: 128m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # HTTP API. Never parses documents beyond magic-byte sniffing.
  # -------------------------------------------------------------------------
  api:
    <<: *backend
    environment:
      <<: *backend-env
      CONTAINER_ROLE: api
    # command: image default (uvicorn app.main:app on :8000, no access log, no Server header)
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks: [internal, egress]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    # healthcheck: inherited from the image (GET /health)

  # -------------------------------------------------------------------------
  # Document processing. internal network ONLY: tools physically cannot reach
  # the internet (architecture.md §6/§7). Phase 1 runs the slim image (stub);
  # Phase 3 switches build.target to runtime-docs-native.
  # -------------------------------------------------------------------------
  worker-docs:
    <<: *backend
    environment:
      <<: *backend-env
      CONTAINER_ROLE: worker-docs
      OMP_THREAD_LIMIT: "1"
    command: ["python", "-m", "app.workers", "worker-docs"]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /work:size=1g,uid=10001,gid=10001,mode=0700
    networks: [internal]
    mem_limit: 2g # includes the /work tmpfs pages
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 30s

  # -------------------------------------------------------------------------
  # Webpage comparison (Phase 5). Egress via the SSRF-guarded fetcher only.
  # -------------------------------------------------------------------------
  worker-web:
    <<: *backend
    environment:
      <<: *backend-env
      CONTAINER_ROLE: worker-web
    command: ["python", "-m", "app.workers", "worker-web"]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /work:size=256m,uid=10001,gid=10001,mode=0700
    networks: [internal, egress]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 30s

  # -------------------------------------------------------------------------
  # LLM calls (Phase 5). Egress to Groq only (enforced by the pinned client
  # base URL locally; by security groups / egress proxy in production).
  # -------------------------------------------------------------------------
  worker-ai:
    <<: *backend
    environment:
      <<: *backend-env
      CONTAINER_ROLE: worker-ai
    command: ["python", "-m", "app.workers", "worker-ai"]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /work:size=256m,uid=10001,gid=10001,mode=0700
    networks: [internal, egress]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 30s

  # -------------------------------------------------------------------------
  # Scheduled cleanup (ADR-0002). One instance; holds a Redis lock anyway.
  # -------------------------------------------------------------------------
  sweeper:
    <<: *backend
    environment:
      <<: *backend-env
      CONTAINER_ROLE: sweeper
    command: ["python", "-m", "app.workers", "sweeper"]
    networks: [internal]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # -------------------------------------------------------------------------
  # Contract mock (frontend can build before the backend exists). docs/api.md §8
  # -------------------------------------------------------------------------
  mock:
    <<: *hardening
    profiles: [mock]
    # Prism CLI 5.16.0 is the version verified against the contract (docs/api.md §8).
    # The stoplight/prism images are amd64-only and 5.15.10 crashes on start, so
    # the pinned CLI runs on the pinned Node image instead (fetched on first start
    # into the tmpfs npm cache; needs egress).
    image: node:24.22.2-alpine@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85
    user: "1000:1000"
    command:
      - npx
      - --yes
      - "@stoplight/prism-cli@5.16.0"
      - mock
      - --host
      - 0.0.0.0
      - --port
      - "4010"
      - /spec/openapi.yaml
    environment:
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NO_UPDATE_NOTIFIER: "1"
    volumes:
      - ./shared:/spec:ro
    tmpfs:
      - /tmp:size=512m,mode=1777,exec
    ports:
      - "127.0.0.1:${MOCK_PORT:-4010}:4010"
    networks: [egress]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4010/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  # -------------------------------------------------------------------------
  # Next.js dev server (optional; production frontend is on Vercel).
  # Not read_only: the dev server writes .next/ and installs node_modules.
  # -------------------------------------------------------------------------
  frontend:
    profiles: [frontend]
    build:
      context: ./infrastructure/docker
      dockerfile: frontend.dev.Dockerfile
    image: doctools-frontend:dev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    working_dir: /srv/frontend
    # command: image default (npm ci, then next dev on 0.0.0.0:3000)
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/srv/frontend
      - ./shared:/srv/shared:ro # same relative layout as the repo (../shared)
      - frontend_node_modules:/srv/frontend/node_modules
      - frontend_next:/srv/frontend/.next
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks: [egress]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

networks:
  internal:
    internal: true
  egress: {}

volumes:
  # Shared temp workspace (LocalBackend). RAM-backed tmpfs, shared by api,
  # workers and sweeper through the local volume driver:
  #   - user documents are never written to the host disk, so they cannot end
  #     up in Time Machine / disk snapshots / volume backups (ADR-0002 §7);
  #   - everything vanishes on `make clean`, `docker compose down -v`, or when
  #     the last container using it stops (losing jobs is acceptable per NFRs).
  # Size counts against host (VM) RAM; raise it if you test large uploads.
  workspaces:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=2g,uid=10001,gid=10001,mode=0700"
  # Postgres data (user/billing data only). Persisted locally on purpose.
  pgdata: {}
  frontend_node_modules: {}
  frontend_next: {}
